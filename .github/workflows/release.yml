name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Security Audit
        run: pnpm audit --audit-level moderate || true

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create parser tag if published
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Check if @bdocs/parser was published
          if echo "${{ steps.changesets.outputs.publishedPackages }}" | grep -q '"name": "@bdocs/parser"'; then
            # Extract version from package.json
            VERSION=$(node -p "require('./packages/parser/package.json').version")
            TAG="@bdocs/parser@${VERSION}"
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
