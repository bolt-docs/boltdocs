name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: '0.17.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test:all

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Check import boundaries
        run: pnpm run check:boundaries

      - name: Security Audit
        run: pnpm audit --audit-level moderate

      - name: Build packages
        run: pnpm run build

      # SPEC §2.3: a plugin that cannot be scanned or has high-risk calls must
      # fail the pipeline, not just warn in a manually invoked command.
      - name: Plugin security audit
        run: pnpm -C docs exec boltdocs audit

      # SPEC §2.2: gate the reproducible 100-page MDX fixture, not the docs site.
      # CI runners differ from the reference machine, so acknowledge that
      # explicitly; the regression threshold is still enforced on every run.
      - name: Benchmark regression (100-page fixture)
        run: |
          pnpm run benchmark:fixture -- --runs 3
          pnpm run benchmark:fixture:gate -- --allow-machine-mismatch

      # SPEC §2.2: dev startup and incremental rebuilds must not regress either.
      - name: Benchmark regression (dev + incremental)
        run: |
          pnpm run benchmark:dev -- --runs 3
          pnpm run benchmark:dev:gate -- --allow-machine-mismatch
          pnpm run benchmark:incremental -- --runs 3
          pnpm run benchmark:incremental:gate -- --allow-machine-mismatch

      # SPEC §6 rule 1: the core's production footprint must not grow silently.
      - name: Core production footprint
        run: pnpm run benchmark:core

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create parser tag if published
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Check if @bdocs/parser was published
          if echo "${{ steps.changesets.outputs.publishedPackages }}" | grep -q '"name": "@bdocs/parser"'; then
            # Extract version from package.json
            VERSION=$(node -p "require('./packages/boltdocs-parser/package.json').version")
            TAG="@bdocs/parser@${VERSION}"
            echo "Creating tag: ${TAG}"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
